name: Feature Request
description: Suggest an idea for jrnl
title: "Feature Report"
labels: [ ":new:", "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        # Feature Request
        Hello, and thank you for reporting an issue!

        Please fill out the points below, as it will make our process much easier.

  - type: textarea
    id: user-case
    attributes:
      label: Use Case/Motivation
      description: What is the motivation / use case for changing the behavior?
      placeholder: IF you are constantly working on a project that is capible pf improving you to be your best self daily, would you not walk around like a badass trying to see where other a
    validations:
      required: true

  - type: textarea
    id: example-usage
    attributes:
      label: Example Usage
      description: Please provide examples of the usage you would like to see.
      placeholder: e.g `jrnl --new-flag="super cool new feature"`
    validations:
      required: true

  - type: textarea
    id: other-info
    attributes:
      label: Slack
      description: > We will use Slack for seperate chat groups and podcast broadcasting.
        https://Crystalcalamagalistic.slack.com
    validations:
      required: true
